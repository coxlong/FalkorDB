name: Build jieba-chinese-tokenizer (debug)

on:
  push:
    branches: [feat/cppjieba-v4.20.1]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build compiler image (debug)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.compiler
          build-args: |
            BUILD_IMAGE=ghcr.io/falkordb/falkordb-build:ubuntu
            DEBUG=1
          tags: localhost:5000/falkordb/falkordb-compiler:debug
          push: true

      - name: Build & push runtime image (debug)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.debug
          build-args: |
            BASE_IMAGE=localhost:5000/falkordb/falkordb-compiler:debug
            BROWSER_TAG=latest
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/falkordb:zh-jieba-debug
            ghcr.io/${{ github.repository_owner }}/falkordb:zh-jieba-debug-${{ github.sha }}
