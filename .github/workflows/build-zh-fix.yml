name: Build Chinese-default-tokenizer image

# Builds a FalkorDB Docker image from this branch (which points the RediSearch
# submodule at the coxlong fork where DEFAULT_LANGUAGE = RS_LANG_CHINESE).
# Mirrors the official build.yml pattern: a local registry relays the
# compiler image (which compiles falkordb.so from source, picking up the
# submodule fix) into the final runtime image (full build, with browser).

on:
  push:
    branches: [fix/default-chinese-tokenizer]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build compiler image (compiles falkordb.so from source)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.compiler
          build-args: |
            BUILD_IMAGE=ghcr.io/falkordb/falkordb-build:ubuntu
            DEBUG=0
          tags: localhost:5000/falkordb/falkordb-compiler
          push: true

      - name: Build & push runtime image (full, with browser)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          build-args: |
            BASE_IMAGE=localhost:5000/falkordb/falkordb-compiler
            BROWSER_TAG=latest
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/falkordb:zh-fix
            ghcr.io/${{ github.repository_owner }}/falkordb:zh-fix-${{ github.sha }}
